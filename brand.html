<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrowsyGuard - Brand Identity</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #022c22;
        }
        .app-icon-shadow {
            box-shadow: 0 20px 40px rgba(2, 44, 34, 0.15), inset 0 1px 0 rgba(255,255,255,0.2);
        }
        .smooth-gradient {
            background: linear-gradient(135deg, #022c22 0%, #064e3b 100%);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- STRICT COLOR PALETTE ---
        const colors = {
            primary: '#064e3b',
            primaryLight: '#047857',
            primaryDark: '#022c22',
            secondary: '#6ee7b7',
            secondaryLight: '#a7f3d0',
            secondaryDark: '#34d399',
            accent: '#0d9488'
        };

        // --- LOGO COMPONENT ---
        // A mathematically perfect SVG combining a Shield Pillar, an AI Radar Arc, and an Alert Core (The Eye)
        const LogoMark = ({ variant = 'light', className = "w-full h-full" }) => {
            const fillColors = variant === 'dark' ? {
                pill: colors.secondary,       // Soft green glowing pillar
                arc: colors.secondaryDark,    // Secondary dark for the arc
                dot: colors.secondaryLight    // Brightest green for the active core
            } : variant === 'icon' ? {
                pill: colors.secondary,       // Bright elements on dark app icon
                arc: colors.secondaryDark,
                dot: colors.secondaryLight
            } : {
                pill: colors.primary,         // Deep green pillar
                arc: colors.accent,           // Teal arc
                dot: colors.secondaryDark     // Visible soft green on light bg
            };

            return (
                <svg viewBox="0 0 100 100" fill="none" className={className} xmlns="http://www.w3.org/2000/svg">
                    {/* The Pillar (Solid, unwavering protection) */}
                    <rect x="18.5" y="15" width="16" height="70" rx="8" fill={fillColors.pill} />
                    
                    {/* The Radar Arc (Monitoring, forming a 'D') */}
                    <path d="M 46.5 23 A 27 27 0 0 1 46.5 77" fill="none" stroke={fillColors.arc} strokeWidth="16" strokeLinecap="round" />
                    
                    {/* The Alert Core (The driver's focus / The AI Eye) */}
                    <circle cx="50" cy="50" r="7.5" fill={fillColors.dot} />
                </svg>
            );
        };

        // --- BRAND DASHBOARD APP ---
        const App = () => {
            useEffect(() => {
                lucide.createIcons();
            }, []);

            const downloadSVG = () => {
                const svgContent = `
<svg width="500" height="500" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="18.5" y="15" width="16" height="70" rx="8" fill="${colors.primary}" />
    <path d="M 46.5 23 A 27 27 0 0 1 46.5 77" fill="none" stroke="${colors.accent}" stroke-width="16" stroke-linecap="round" />
    <circle cx="50" cy="50" r="7.5" fill="${colors.secondaryDark}" />
</svg>`;
                const blob = new Blob([svgContent.trim()], { type: "image/svg+xml;charset=utf-8" });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.download = "DrowsyGuard-Logo-Mark.svg";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return (
                <div className="min-h-screen pb-20">
                    {/* HERO SECTION */}
                    <header className="pt-24 pb-16 px-6 flex flex-col items-center text-center max-w-5xl mx-auto">
                        <div className="w-32 h-32 md:w-40 md:h-40 mb-8 transform hover:scale-105 transition-transform duration-500">
                            <LogoMark variant="light" />
                        </div>
                        <h1 className="text-5xl md:text-7xl font-bold tracking-tight text-[#022c22] mb-4 flex items-center justify-center gap-1">
                            Drowsy<span className="text-[#0d9488] font-light">Guard</span>
                        </h1>
                        <p className="text-xl md:text-2xl text-[#047857] font-medium tracking-wide mb-8">
                            Intelligent Driving Protection.
                        </p>
                        <div className="flex gap-4">
                            <button onClick={downloadSVG} className="flex items-center gap-2 bg-[#064e3b] hover:bg-[#047857] text-white px-6 py-3 rounded-full font-medium transition-colors shadow-lg shadow-emerald-900/20">
                                <i data-lucide="download" className="w-5 h-5"></i>
                                Download SVG Logo
                            </button>
                        </div>
                    </header>

                    {/* GEOMETRY & MEANING */}
                    <section className="py-16 px-6 bg-white border-y border-gray-100">
                        <div className="max-w-6xl mx-auto">
                            <h2 className="text-sm uppercase tracking-[0.2em] text-[#0d9488] font-bold mb-12 text-center">The Architecture of Safety</h2>
                            
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-12">
                                <div className="flex flex-col items-center text-center group">
                                    <div className="w-16 h-16 rounded-2xl bg-emerald-50 flex items-center justify-center mb-6 text-[#064e3b] group-hover:bg-[#064e3b] group-hover:text-white transition-colors">
                                        <i data-lucide="shield-check" className="w-8 h-8"></i>
                                    </div>
                                    <h3 className="text-xl font-bold mb-3 text-[#022c22]">The Pillar</h3>
                                    <p className="text-gray-600 leading-relaxed text-sm">
                                        The solid vertical structure represents your core safety system. It acts as an unwavering shield and forms the structural backbone of the 'D'.
                                    </p>
                                </div>
                                <div className="flex flex-col items-center text-center group">
                                    <div className="w-16 h-16 rounded-2xl bg-emerald-50 flex items-center justify-center mb-6 text-[#0d9488] group-hover:bg-[#0d9488] group-hover:text-white transition-colors">
                                        <i data-lucide="radar" className="w-8 h-8"></i>
                                    </div>
                                    <h3 className="text-xl font-bold mb-3 text-[#022c22]">The Sweep</h3>
                                    <p className="text-gray-600 leading-relaxed text-sm">
                                        The sweeping arc symbolizes continuous, AI-powered radar monitoring. It envelops the driver, providing an intelligent perimeter of awareness.
                                    </p>
                                </div>
                                <div className="flex flex-col items-center text-center group">
                                    <div className="w-16 h-16 rounded-2xl bg-emerald-50 flex items-center justify-center mb-6 text-[#34d399] group-hover:bg-[#34d399] group-hover:text-white transition-colors">
                                        <i data-lucide="eye" className="w-8 h-8"></i>
                                    </div>
                                    <h3 className="text-xl font-bold mb-3 text-[#022c22]">The Core</h3>
                                    <p className="text-gray-600 leading-relaxed text-sm">
                                        A glowing, perfectly balanced dot at the mathematical center represents the driver's focus and the system's "alert node" ready to activate.
                                    </p>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* LOGO VARIATIONS & APP ICON */}
                    <section className="py-20 px-6 max-w-6xl mx-auto">
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                            
                            {/* Dark Mode Variant */}
                            <div className="smooth-gradient rounded-[2.5rem] p-12 flex flex-col items-center justify-center relative overflow-hidden group">
                                <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-5"></div>
                                <div className="w-40 h-40 mb-8 relative z-10">
                                    <LogoMark variant="dark" />
                                </div>
                                <h2 className="text-4xl font-bold tracking-tight text-white mb-2 relative z-10 flex items-center gap-1">
                                    Drowsy<span className="text-[#6ee7b7] font-light">Guard</span>
                                </h2>
                                <p className="text-[#a7f3d0] tracking-widest text-sm uppercase relative z-10">Dark Mode</p>
                            </div>

                            {/* App Icon Showcase */}
                            <div className="bg-gray-100 rounded-[2.5rem] p-12 flex flex-col items-center justify-center border border-gray-200">
                                <div className="w-48 h-48 smooth-gradient rounded-[22.5%] p-8 app-icon-shadow mb-8 relative">
                                    {/* App Icon Gloss Overlay */}
                                    <div className="absolute inset-0 bg-gradient-to-b from-white/20 to-transparent rounded-[22.5%] pointer-events-none"></div>
                                    <LogoMark variant="icon" />
                                </div>
                                <p className="text-gray-500 tracking-widest text-sm uppercase font-semibold">iOS / Android App Icon</p>
                            </div>

                        </div>
                    </section>

                    {/* COLOR SYSTEM */}
                    <section className="py-16 px-6 max-w-6xl mx-auto">
                        <h2 className="text-sm uppercase tracking-[0.2em] text-gray-400 font-bold mb-8">Strict Color System</h2>
                        <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4">
                            {[
                                { name: 'Primary Dark', hex: colors.primaryDark },
                                { name: 'Primary', hex: colors.primary },
                                { name: 'Primary Light', hex: colors.primaryLight },
                                { name: 'Accent', hex: colors.accent },
                                { name: 'Secondary Dark', hex: colors.secondaryDark },
                                { name: 'Secondary', hex: colors.secondary },
                                { name: 'Secondary Light', hex: colors.secondaryLight },
                            ].map((color) => (
                                <div key={color.hex} className="flex flex-col group">
                                    <div 
                                        className="h-24 w-full rounded-2xl mb-3 shadow-inner border border-black/5 group-hover:scale-105 transition-transform origin-bottom"
                                        style={{ backgroundColor: color.hex }}
                                    ></div>
                                    <span className="text-xs font-bold text-gray-800">{color.name}</span>
                                    <span className="text-xs text-gray-500 font-mono uppercase">{color.hex}</span>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* TYPOGRAPHY */}
                    <section className="py-16 px-6 max-w-6xl mx-auto border-t border-gray-200 mt-8">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-16 items-center">
                            <div>
                                <h2 className="text-sm uppercase tracking-[0.2em] text-gray-400 font-bold mb-6">Typography</h2>
                                <h3 className="text-5xl font-medium text-[#022c22] mb-2">Inter</h3>
                                <p className="text-gray-500 mb-6">A highly legible, premium geometric sans-serif that ensures clarity at a glance while driving.</p>
                                <div className="space-y-2">
                                    <p className="font-light text-2xl text-gray-800">Aa Bb Cc Dd Ee Ff (Light)</p>
                                    <p className="font-medium text-2xl text-gray-800">Aa Bb Cc Dd Ee Ff (Medium)</p>
                                    <p className="font-bold text-2xl text-gray-800">Aa Bb Cc Dd Ee Ff (Bold)</p>
                                </div>
                            </div>
                            <div className="bg-white p-12 rounded-3xl shadow-sm border border-gray-100 flex flex-col items-center justify-center">
                                <div className="w-16 h-16 mb-6">
                                    <LogoMark variant="light" />
                                </div>
                                <h2 className="text-4xl font-bold tracking-tight text-[#064e3b] mb-4 flex items-center gap-1">
                                    Drowsy<span className="text-[#0d9488] font-light">Guard</span>
                                </h2>
                                <p className="text-[#047857] text-sm uppercase tracking-[0.2em] font-semibold">
                                    Stay Awake. Stay Safe.
                                </p>
                            </div>
                        </div>
                    </section>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
